name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scopepilot
          POSTGRES_PASSWORD: scopepilot
          POSTGRES_DB: scopepilot_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U scopepilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://scopepilot:scopepilot@localhost:5432/scopepilot_test
      AUTH_SECRET: "01234567890123456789012345678901"
      NEXTAUTH_SECRET: "01234567890123456789012345678901"
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma validate
      - run: pnpm prisma migrate deploy
      - run: pnpm typecheck

      - run: pnpm test
        env:
          NODE_ENV: test

      - run: pnpm build
        env:
          NODE_ENV: production

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
